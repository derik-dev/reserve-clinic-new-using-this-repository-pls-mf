mutation CreateConsulta(
  $pacienteId: UUID
  $pacienteNome: String!
  $pacienteTelefone: String
  $pacienteEmail: String
  $dataHora: Timestamp!
  $duracaoMin: Int!
  $servico: String
  $profissional: String
  $profissionalId: UUID
  $valor: Float
  $status: String!
  $pixId: String
  $metodoPagamento: String
  $observacoes: String
) @auth(level: USER) {
  consulta_insert(data: {
    perfilId_expr: "auth.uid"
    pacienteId: $pacienteId
    pacienteNome: $pacienteNome
    pacienteTelefone: $pacienteTelefone
    pacienteEmail: $pacienteEmail
    dataHora: $dataHora
    duracaoMin: $duracaoMin
    servico: $servico
    profissional: $profissional
    profissionalId: $profissionalId
    valor: $valor
    status: $status
    pixId: $pixId
    metodoPagamento: $metodoPagamento
    observacoes: $observacoes
    origem: "painel"
  })
}

