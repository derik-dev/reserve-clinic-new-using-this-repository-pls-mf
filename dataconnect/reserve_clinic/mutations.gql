# Reserve Clinic write operations.

mutation UpsertMeuPerfil(
  $nome: String!
  $slug: String!
  $tipo: String
  $telefone: String
  $emailContato: String
  $logoUrl: String
  $corPrimaria: String
  $corSecundaria: String
  $cpfCnpj: String
  $enderecoCep: String
  $enderecoRua: String
  $enderecoNumero: String
  $enderecoBairro: String
  $enderecoCidade: String
  $enderecoUf: String
  $pixChave: String
  $site: String
  $instagram: String
  $tiktok: String
  $valorConsulta: Float
) @auth(level: USER) {
  perfil_upsert(data: {
    id_expr: "auth.uid"
    nome: $nome
    slug: $slug
    tipo: $tipo
    telefone: $telefone
    emailContato: $emailContato
    logoUrl: $logoUrl
    corPrimaria: $corPrimaria
    corSecundaria: $corSecundaria
    cpfCnpj: $cpfCnpj
    enderecoCep: $enderecoCep
    enderecoRua: $enderecoRua
    enderecoNumero: $enderecoNumero
    enderecoBairro: $enderecoBairro
    enderecoCidade: $enderecoCidade
    enderecoUf: $enderecoUf
    pixChave: $pixChave
    site: $site
    instagram: $instagram
    tiktok: $tiktok
    valorConsulta: $valorConsulta
    onboardingConcluido: true
  })
}

mutation UpsertMinhaConfiguracao(
  $agendaConfig: Any!
  $duracaoAtendimentoMin: Int
  $tipoPagamento: String
  $valorAtendimento: Float
  $valorSinal: Float
  $antecedenciaMinimaHoras: Int
  $qrCodeManualUrl: String
  $chavePixManual: String
) @auth(level: USER) {
  configuracao_upsert(data: {
    perfilId_expr: "auth.uid"
    agendaConfig: $agendaConfig
    duracaoAtendimentoMin: $duracaoAtendimentoMin
    tipoPagamento: $tipoPagamento
    valorAtendimento: $valorAtendimento
    valorSinal: $valorSinal
    antecedenciaMinimaHoras: $antecedenciaMinimaHoras
    qrCodeManualUrl: $qrCodeManualUrl
    chavePixManual: $chavePixManual
  })
}

mutation CreatePaciente(
  $nome: String!
  $telefone: String
  $email: String
  $cpf: String
  $dataNascimento: Date
  $observacoes: String
) @auth(level: USER) {
  paciente_insert(data: {
    perfilId_expr: "auth.uid"
    nome: $nome
    telefone: $telefone
    email: $email
    cpf: $cpf
    dataNascimento: $dataNascimento
    observacoes: $observacoes
    status: "ativo"
  })
}

mutation UpdatePaciente(
  $id: UUID!
  $nome: String!
  $telefone: String
  $email: String
  $cpf: String
  $dataNascimento: Date
  $observacoes: String
) @auth(level: USER) {
  paciente_update(
    first: { where: { id: { eq: $id }, perfilId: { eq_expr: "auth.uid" } } }
    data: {
      nome: $nome
      telefone: $telefone
      email: $email
      cpf: $cpf
      dataNascimento: $dataNascimento
      observacoes: $observacoes
    }
  )
}

mutation SetPacienteStatus($id: UUID!, $status: String!) @auth(level: USER) {
  paciente_update(
    first: { where: { id: { eq: $id }, perfilId: { eq_expr: "auth.uid" } } }
    data: { status: $status }
  )
}

mutation DeletePaciente($id: UUID!) @auth(level: USER) {
  paciente_delete(first: { where: { id: { eq: $id }, perfilId: { eq_expr: "auth.uid" } } })
}

