mutation SetConsultaStatus($id: UUID!, $status: String!, $pacienteId: UUID) @auth(level: USER) {
  consulta_update(
    first: { where: { id: { eq: $id }, perfilId: { eq_expr: "auth.uid" } } }
    data: { status: $status, pacienteId: $pacienteId }
  )
}

mutation DeleteConsulta($id: UUID!) @auth(level: USER) {
  consulta_delete(first: { where: { id: { eq: $id }, perfilId: { eq_expr: "auth.uid" } } })
}

mutation CreatePublicConsulta(
  $perfilId: String!
  $clienteNome: String!
  $clienteTelefone: String
  $clienteEmail: String
  $dataHora: Timestamp!
  $duracaoMin: Int!
  $servico: String
  $profissional: String
  $profissionalId: UUID
  $valor: Float
  $observacoes: String
) @auth(level: PUBLIC, insecureReason: "Public patients can request a booking through the public clinic link.") @transaction {
  query @redact {
    perfil(key: { id: $perfilId }) @check(expr: "this != null", message: "Clinica nao encontrada.") {
      id
    }
  }
  consulta_insert(data: {
    perfilId: $perfilId
    pacienteNome: $clienteNome
    pacienteTelefone: $clienteTelefone
    pacienteEmail: $clienteEmail
    dataHora: $dataHora
    duracaoMin: $duracaoMin
    servico: $servico
    profissional: $profissional
    profissionalId: $profissionalId
    valor: $valor
    status: "aguardando"
    metodoPagamento: "pix"
    observacoes: $observacoes
    origem: "publico"
  })
}

mutation SetConsultaPixId($consultaId: UUID!, $pixId: String!) @auth(level: NO_ACCESS) {
  consulta_update(id: $consultaId, data: { pixId: $pixId })
}

mutation ConfirmarConsultaPaga($consultaId: UUID!, $valorPago: Float) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    consulta(id: $consultaId) @check(expr: "this != null", message: "Consulta nao encontrada.") {
      perfilId
      dataHora
    }
  }
  consulta_update(id: $consultaId, data: { status: "confirmada", valor: $valorPago })
}
